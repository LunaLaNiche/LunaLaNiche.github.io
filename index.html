<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luna — équipe</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1B6FB8">
<!-- Icône « Ajouter à l'écran d'accueil » -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Luna">
<link rel="apple-touch-icon" href="https://cm4-production-assets.s3.amazonaws.com/1789129254996-logo_luna_fondblanc.jpg">
<link rel="icon" href="https://cm4-production-assets.s3.amazonaws.com/1789129254996-logo_luna_fondblanc.jpg">
<style>
html, body { margin: 0; height: 100%; background: #ffffff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display: flex; flex-direction: column; height: 100dvh; }
#luna { flex: 1 1 auto; min-height: 0; width: 100%; }
</style>
</head>
<body>
<div id="luna"></div>
<!-- Micro en français : le widget démarre la reconnaissance vocale du navigateur sans langue, donc le téléphone utiliserait sa propre langue. On fixe fr-CA avant le chargement du widget. -->
<script type="text/javascript">
(function () {
var Native = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!Native) return;
function FrenchRecognition() { var r = new Native(); r.lang = 'fr-CA'; return r; }
FrenchRecognition.prototype = Native.prototype;
window.SpeechRecognition = FrenchRecognition;
window.webkitSpeechRecognition = FrenchRecognition;
})();
</script>
<!-- Chargé une seule fois. Version PUBLIÉE de Voiceflow, affichée plein écran. -->
<script type="text/javascript">
(function (d, t) {
var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
v.onload = function () {
window.voiceflow.chat.load({
verify: { projectID: '6aa45f238108f292ae45db64' },
url: 'https://general-runtime.voiceflow.com',
voice: { url: 'https://runtime-api.voiceflow.com' },
render: { mode: 'embedded', target: d.getElementById('luna') },
autostart: true
});
};
v.src = 'https://cdn.voiceflow.com/widget-next/bundle.mjs';
v.type = 'text/javascript';
s.parentNode.insertBefore(v, s);
})(document, 'script');
</script>
</body>
</html>
