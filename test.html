<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Luna — TEST scanner</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1B6FB8">
  <link rel="icon" href="https://cm4-production-assets.s3.amazonaws.com/1789129254996-logo_luna_fondblanc.jpg">
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; height: 100dvh; }
    #luna { flex: 1 1 auto; min-height: 0; width: 100%; }
    .barre { flex: 0 0 auto; display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #e3e8ee; }
    .barre button { min-height: 48px; padding: 0 20px; border: 0; border-radius: 24px; background: #1B6FB8; color: #fff; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; }
    .barre button:active { background: #155a96; }
    /* TEST seulement : bandeau pour ne pas confondre avec la vraie page */
    .test { margin-right: auto; padding: 6px 12px; border-radius: 8px; background: #fff3cd; color: #6b4e00; font-size: 14px; font-weight: 600; }

    /* Scanner plein écran */
    #scan { position: fixed; inset: 0; z-index: 2147483000; display: none; flex-direction: column; background: #000; color: #fff; }
    #scan.ouvert { display: flex; }
    #scan .video { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
    #scan video { width: 100%; height: 100%; object-fit: cover; }
    #scan .cadre { position: absolute; left: 10%; right: 10%; top: 35%; height: 30%; border: 4px solid rgba(255,255,255,.9); border-radius: 16px; box-shadow: 0 0 0 9999px rgba(0,0,0,.35); pointer-events: none; }
    #scan .aide { position: absolute; left: 0; right: 0; top: 20%; text-align: center; font-size: 20px; font-weight: 600; text-shadow: 0 1px 4px #000; padding: 0 16px; }
    #scan .bas { flex: 0 0 auto; display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #111; }
    #scan .ligne { display: flex; gap: 10px; }
    #scan input { flex: 1 1 auto; min-width: 0; min-height: 52px; padding: 0 16px; border: 0; border-radius: 12px; font: inherit; font-size: 22px; letter-spacing: 1px; }
    #scan button { min-height: 52px; padding: 0 22px; border: 0; border-radius: 26px; font: inherit; font-size: 18px; font-weight: 600; cursor: pointer; }
    #scan .envoyer { background: #1B6FB8; color: #fff; }
    #scan .fermer { background: #fff; color: #111; }
    #scan .message { min-height: 1.2em; font-size: 16px; color: #ffd27a; }
  </style>
</head>
<body>
  <div class="barre">
    <span class="test">PAGE DE TEST (brouillon de Luna)</span>
    <button type="button" id="scanner">📷 Scanner</button>
    <button type="button" id="nouvelle">+ Nouvelle conversation</button>
  </div>
  <div id="luna"></div>

  <div id="scan" role="dialog" aria-modal="true" aria-label="Scanner un code-barres">
    <div class="video">
      <video id="camera" playsinline muted></video>
      <div class="cadre"></div>
      <div class="aide" id="aide">Place le code-barres dans le cadre</div>
    </div>
    <div class="bas">
      <div class="message" id="message"></div>
      <div class="ligne">
        <input id="saisie" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="ou tape les chiffres du code">
        <button type="button" class="envoyer" id="envoyer">Envoyer</button>
      </div>
      <button type="button" class="fermer" id="fermer">Fermer</button>
    </div>
  </div>

  <script type="text/javascript">
    // TEST : la conversation est gardée dans sessionStorage (onglet seulement) pour ne pas
    // toucher à la conversation de index.html, qui utilise localStorage sur la même origine.
    document.getElementById('nouvelle').addEventListener('click', function () {
      if (!confirm('Commencer une nouvelle conversation ? La conversation actuelle sera effacée de l\'écran.')) return;
      try {
        Object.keys(sessionStorage).forEach(function (k) {
          if (k.toLowerCase().indexOf('voiceflow') === 0) sessionStorage.removeItem(k);
        });
      } catch (e) {}
      location.reload();
    });
  </script>

  <!-- Micro en français (inchangé par rapport à index.html) -->
  <script type="text/javascript">
    (function () {
      var Native = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Native) return;
      function FrenchRecognition() { var r = new Native(); r.lang = 'fr-CA'; return r; }
      FrenchRecognition.prototype = Native.prototype;
      window.SpeechRecognition = FrenchRecognition;
      window.webkitSpeechRecognition = FrenchRecognition;
    })();
  </script>

  <!-- Scanner de code-barres -->
  <script type="text/javascript">
    (function () {
      var overlay = document.getElementById('scan');
      var video = document.getElementById('camera');
      var aide = document.getElementById('aide');
      var message = document.getElementById('message');
      var saisie = document.getElementById('saisie');
      var flux = null, minuterie = null, detecteur = null, actif = false;

      // UPC-E (8 chiffres) → UPC-A (12 chiffres), car la boutique enregistre les codes en UPC-A.
      function upcEversA(c) {
        var ns = c[0], d = c.substr(1, 6), cle = c[7], x = d[5];
        var corps;
        if (x === '0' || x === '1' || x === '2') corps = d.substr(0, 2) + x + '0000' + d.substr(2, 3);
        else if (x === '3') corps = d.substr(0, 3) + '00000' + d.substr(3, 2);
        else if (x === '4') corps = d.substr(0, 4) + '00000' + d[4];
        else corps = d.substr(0, 5) + '0000' + x;
        return ns + corps + cle;
      }

      function normaliser(brut, format) {
        var c = String(brut || '').replace(/\D/g, '');
        if (!c) return '';
        if (c.length === 13 && c[0] === '0') return c.substr(1);        // EAN-13 d'un UPC-A
        if (c.length === 8 && format === 'upc_e') return upcEversA(c);   // UPC-E compressé
        return c;
      }

      function envoyer(code) {
        if (!code) { message.textContent = 'Aucun chiffre à envoyer.'; return false; }
        if (!window.voiceflow || !window.voiceflow.chat || !window.voiceflow.chat.interact) {
          message.textContent = 'Luna est encore en train de charger. Réessaie dans un instant.';
          return false;
        }
        window.voiceflow.chat.interact({ type: 'text', payload: 'Code-barres : ' + code });
        return true;
      }

      function arreterCamera() {
        actif = false;
        if (minuterie) { clearTimeout(minuterie); minuterie = null; }
        if (flux) { flux.getTracks().forEach(function (t) { t.stop(); }); flux = null; }
        video.srcObject = null;
      }

      function fermer() {
        arreterCamera();
        overlay.classList.remove('ouvert');
        saisie.value = '';
        message.textContent = '';
      }

      function trouve(code) {
        arreterCamera();
        if (navigator.vibrate) { try { navigator.vibrate(120); } catch (e) {} }
        if (envoyer(code)) fermer();
      }

      function boucle() {
        if (!actif) return;
        if (video.readyState < 2) { minuterie = setTimeout(boucle, 250); return; }
        detecteur.detect(video).then(function (res) {
          if (!actif) return;
          if (res && res.length) {
            var code = normaliser(res[0].rawValue, res[0].format);
            if (code.length >= 8) { trouve(code); return; }
          }
          minuterie = setTimeout(boucle, 250);
        }).catch(function () {
          if (actif) minuterie = setTimeout(boucle, 400);
        });
      }

      function modeSaisie(texte) {
        aide.textContent = texte;
        message.textContent = '';
        setTimeout(function () { saisie.focus(); }, 100);
      }

      function ouvrir() {
        overlay.classList.add('ouvert');
        saisie.value = '';
        message.textContent = '';
        aide.textContent = 'Place le code-barres dans le cadre';

        if (!('BarcodeDetector' in window)) {
          modeSaisie('Ce navigateur ne lit pas les codes-barres. Tape les chiffres sous le code.');
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          modeSaisie('Caméra non disponible. Tape les chiffres sous le code.');
          return;
        }
        var formats = ['upc_a', 'ean_13', 'upc_e', 'ean_8', 'code_128'];
        var pret = (BarcodeDetector.getSupportedFormats ? BarcodeDetector.getSupportedFormats() : Promise.resolve(formats))
          .then(function (ok) {
            var f = formats.filter(function (x) { return ok.indexOf(x) !== -1; });
            detecteur = new BarcodeDetector({ formats: f.length ? f : formats });
          });
        pret.then(function () {
          return navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
        }).then(function (s) {
          if (!overlay.classList.contains('ouvert')) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
          flux = s;
          video.srcObject = s;
          return video.play().then(function () { actif = true; boucle(); });
        }).catch(function (e) {
          arreterCamera();
          var refus = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
          modeSaisie(refus
            ? 'Accès à la caméra refusé. Autorise la caméra dans Chrome (cadenas à côté de l\'adresse), ou tape les chiffres.'
            : 'Impossible d\'ouvrir la caméra. Tape les chiffres sous le code.');
        });
      }

      document.getElementById('scanner').addEventListener('click', ouvrir);
      document.getElementById('fermer').addEventListener('click', fermer);
      document.getElementById('envoyer').addEventListener('click', function () {
        // Code tapé : on ne convertit que l'EAN-13 avec 0 initial (8 chiffres peut être EAN-8 ou UPC-E).
        var code = normaliser(saisie.value, '');
        if (code.length < 8) { message.textContent = 'Le code doit avoir au moins 8 chiffres.'; return; }
        if (envoyer(code)) fermer();
      });
      saisie.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('envoyer').click();
      });
      document.addEventListener('visibilitychange', function () {
        if (document.hidden && overlay.classList.contains('ouvert')) fermer();
      });
    })();
  </script>

  <!-- TEST : charge le BROUILLON de Voiceflow (versionID development), pas la version publiée. -->
  <script type="text/javascript">
    (function (d, t) {
      var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
      v.onload = function () {
        window.voiceflow.chat.load({
          verify: { projectID: '6aa45f238108f292ae45db64' },
          url: 'https://general-runtime.voiceflow.com',
          versionID: 'development',
          voice: { url: 'https://runtime-api.voiceflow.com' },
          render: { mode: 'embedded', target: d.getElementById('luna') },
          assistant: { persistence: 'sessionStorage' },
          autostart: true
        });
      };
      v.src = 'https://cdn.voiceflow.com/widget-next/bundle.mjs';
      v.type = 'text/javascript';
      s.parentNode.insertBefore(v, s);
    })(document, 'script');
  </script>
</body>
</html>
