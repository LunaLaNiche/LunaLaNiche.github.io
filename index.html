    #formation .puces { display: flex; flex-wrap: wrap; gap: 10px; }
    #formation .puce { min-height: 56px; padding: 0 22px; border: 2px solid #1B6FB8; border-radius: 28px; background: #fff; color: #1B6FB8; font: inherit; font-size: 18px; font-weight: 600; cursor: pointer; }
    #formation .puce:active { background: #e8f1fa; }
    #formation .bouton { min-height: 56px; padding: 0 26px; border: 0; border-radius: 28px; background: #1B6FB8; color: #fff; font: inherit; font-size: 19px; font-weight: 600; cursor: pointer; }
    #formation .bouton:active { background: #155a96; }
    #formation .bouton.secondaire { background: #fff; color: #1B6FB8; border: 2px solid #1B6FB8; }
    #formation .boutons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
    #formation .lien { border: 0; background: none; color: #1B6FB8; font: inherit; font-size: 17px; font-weight: 600; padding: 10px 0; cursor: pointer; }

    #formation .choix { display: flex; flex-direction: column; gap: 12px; }
    #formation .choix button { display: flex; gap: 12px; align-items: flex-start; width: 100%; min-height: 60px; padding: 14px 18px; text-align: left; border: 2px solid #c9d6e3; border-radius: 14px; background: #fff; color: #1c2b39; font: inherit; font-size: 19px; line-height: 1.35; cursor: pointer; }
    #formation .choix button .lettre { flex: 0 0 auto; font-weight: 700; color: #1B6FB8; }
    #formation .choix button:disabled { cursor: default; }

    #formation .retour.ok { border-left-color: #2e7d32; }

    #formation .note-discussion { margin-top: 20px; padding: 14px 18px; border-radius: 14px; background: #e8f1fa; border-left: 6px solid #1B6FB8; font-size: 18px; line-height: 1.45; }

    #formation .revoir .q { font-weight: 600; font-size: 18px; }
    #formation .revoir .r { color: #2e7d32; font-weight: 600; margin-top: 6px; font-size: 17px; }
    #formation .revoir .e { margin-top: 6px; font-size: 17px; line-height: 1.45; }

<body>
  <!-- La conversation reste sur l'appareil (même après un rechargement) jusqu'à ce que
       l'employé·e choisisse d'en commencer une nouvelle. -->
  <div class="barre">
    <div class="onglets" role="tablist">
      <button type="button" class="onglet actif" id="onglet-luna" role="tab" aria-selected="true">💬 Luna</button>
      <button type="button" class="onglet" id="onglet-formation" role="tab" aria-selected="false">🎓 Formation</button>
    </div>
    <div class="actions" id="actions-luna">
      <button type="button" id="scanner">📷 Scanner</button>
      <button type="button" id="nouvelle">+ Nouvelle conversation</button>
    </div>
  </div>
  <div id="luna"></div>
  <section id="formation" class="cache" aria-label="Formation"><div class="page" id="formation-contenu"></div></section>

  <div id="scan" role="dialog" aria-modal="true" aria-label="Scanner un code-barres">
    <div class="video">
      <video id="camera" playsinline muted></video>
      <div class="cadre"></div>
      <div class="aide" id="aide">Place le code-barres dans le cadre</div>
    </div>
    <div class="bas">
      <div class="message" id="message"></div>
      <div class="ligne">
        <input id="saisie" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="ou tape les chiffres du code">
        <button type="button" class="envoyer" id="envoyer">Envoyer</button>
      </div>
      <button type="button" class="fermer" id="fermer">Fermer</button>
    </div>
  </div>

  <script type="text/javascript">
    document.getElementById('nouvelle').addEventListener('click', function () {
      if (!confirm('Commencer une nouvelle conversation ? La conversation actuelle sera effacée de l\'écran.')) return;
      try {
        // Le widget garde sa session sous des clés « voiceflow… » : on les retire puis on recharge.
        Object.keys(localStorage).forEach(function (k) {
          if (k.toLowerCase().indexOf('voiceflow') === 0) localStorage.removeItem(k);
        });
      } catch (e) {}
      location.reload();
    });
  </script>

  <!-- Micro en français : le widget démarre la reconnaissance vocale du navigateur sans langue,
       donc le téléphone utiliserait sa propre langue. On fixe fr-CA avant le chargement du widget. -->
  <script type="text/javascript">
    (function () {
      var Native = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Native) return;
      function FrenchRecognition() { var r = new Native(); r.lang = 'fr-CA'; return r; }
      FrenchRecognition.prototype = Native.prototype;
      window.SpeechRecognition = FrenchRecognition;
      window.webkitSpeechRecognition = FrenchRecognition;
    })();
  </script>

  <!-- Scanner de code-barres : caméra arrière + BarcodeDetector de Chrome, ou saisie des chiffres.
       Envoie « Code-barres : <chiffres> » à Luna (étiquette de la boutique ou code du fabricant). -->
  <script type="text/javascript">
    (function () {
      var overlay = document.getElementById('scan');
      var video = document.getElementById('camera');
      var aide = document.getElementById('aide');
      var message = document.getElementById('message');
      var saisie = document.getElementById('saisie');
      var flux = null, minuterie = null, detecteur = null, actif = false;

      // UPC-E (8 chiffres) → UPC-A (12 chiffres), car la boutique enregistre les codes en UPC-A.
      function upcEversA(c) {
        var ns = c[0], d = c.substr(1, 6), cle = c[7], x = d[5];
        var corps;
        if (x === '0' || x === '1' || x === '2') corps = d.substr(0, 2) + x + '0000' + d.substr(2, 3);
        else if (x === '3') corps = d.substr(0, 3) + '00000' + d.substr(3, 2);
        else if (x === '4') corps = d.substr(0, 4) + '00000' + d[4];
        else corps = d.substr(0, 5) + '0000' + x;
        return ns + corps + cle;
      }

      function normaliser(brut, format) {
        var c = String(brut || '').replace(/\D/g, '');
        if (!c) return '';
        if (c.length === 13 && c[0] === '0') return c.substr(1);        // EAN-13 d'un UPC-A
        if (c.length === 8 && format === 'upc_e') return upcEversA(c);   // UPC-E compressé
        return c;
      }

      function envoyer(code) {
        if (!code) { message.textContent = 'Aucun chiffre à envoyer.'; return false; }
        if (!window.voiceflow || !window.voiceflow.chat || !window.voiceflow.chat.interact) {
          message.textContent = 'Luna est encore en train de charger. Réessaie dans un instant.';
          return false;
        }
        window.voiceflow.chat.interact({ type: 'text', payload: 'Code-barres : ' + code });
        return true;
      }

      function arreterCamera() {
        actif = false;
        if (minuterie) { clearTimeout(minuterie); minuterie = null; }
        if (flux) { flux.getTracks().forEach(function (t) { t.stop(); }); flux = null; }
        video.srcObject = null;
      }

      function fermer() {
        arreterCamera();
        overlay.classList.remove('ouvert');
        saisie.value = '';
        message.textContent = '';
      }

      function trouve(code) {
        arreterCamera();
        if (navigator.vibrate) { try { navigator.vibrate(120); } catch (e) {} }
        if (envoyer(code)) fermer();
      }

      function boucle() {
        if (!actif) return;
        if (video.readyState < 2) { minuterie = setTimeout(boucle, 250); return; }
        detecteur.detect(video).then(function (res) {
          if (!actif) return;
          if (res && res.length) {
            var code = normaliser(res[0].rawValue, res[0].format);
            if (code.length >= 8) { trouve(code); return; }
          }
          minuterie = setTimeout(boucle, 250);
        }).catch(function () {
          if (actif) minuterie = setTimeout(boucle, 400);
        });
      }

      function modeSaisie(texte) {
        aide.textContent = texte;
        message.textContent = '';
        setTimeout(function () { saisie.focus(); }, 100);
      }

      function ouvrir() {
        overlay.classList.add('ouvert');
        saisie.value = '';
        message.textContent = '';
        aide.textContent = 'Place le code-barres dans le cadre';

        if (!('BarcodeDetector' in window)) {
          modeSaisie('Ce navigateur ne lit pas les codes-barres. Tape les chiffres sous le code.');
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          modeSaisie('Caméra non disponible. Tape les chiffres sous le code.');
          return;
        }
        var formats = ['upc_a', 'ean_13', 'upc_e', 'ean_8', 'code_128'];
        var pret = (BarcodeDetector.getSupportedFormats ? BarcodeDetector.getSupportedFormats() : Promise.resolve(formats))
          .then(function (ok) {
            var f = formats.filter(function (x) { return ok.indexOf(x) !== -1; });
            detecteur = new BarcodeDetector({ formats: f.length ? f : formats });
          });
        pret.then(function () {
          return navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
        }).then(function (s) {
          if (!overlay.classList.contains('ouvert')) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
          flux = s;
          video.srcObject = s;
          return video.play().then(function () { actif = true; boucle(); });
        }).catch(function (e) {
          arreterCamera();
          var refus = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
          modeSaisie(refus
            ? 'Accès à la caméra refusé. Autorise la caméra dans Chrome (cadenas à côté de l\'adresse), ou tape les chiffres.'
            : 'Impossible d\'ouvrir la caméra. Tape les chiffres sous le code.');
        });
      }

      document.getElementById('scanner').addEventListener('click', ouvrir);
      document.getElementById('fermer').addEventListener('click', fermer);
      document.getElementById('envoyer').addEventListener('click', function () {
        // Code tapé : on ne convertit que l'EAN-13 avec 0 initial (8 chiffres peut être EAN-8 ou UPC-E).
        var code = normaliser(saisie.value, '');
        if (code.length < 8) { message.textContent = 'Le code doit avoir au moins 8 chiffres.'; return; }
        if (envoyer(code)) fermer();
      });
      saisie.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('envoyer').click();
      });
      document.addEventListener('visibilitychange', function () {
        if (document.hidden && overlay.classList.contains('ouvert')) fermer();
      });
    })();
  </script>

ers, sans reçu, payé par carte de crédit. Que fais-tu?","choix":[["Je refuse : pas de reçu",0],["Je retrouve l'achat avec son nom, son téléphone ou son numéro de commande, puis je rembourse en argent",1],["Je le rembourse sur sa carte de crédit au terminal de la caisse",0],["Je donne un crédit seulement",0]],"explication":"Moins de la moitié du sac a été utilisée : garantie satisfaction. Sans reçu, on retrouve l'achat dans le système (sans dossier, le reçu est obligatoire). Un achat en ligne se rembourse en boutique : en argent par le caissier, ou par PayPal/Stripe par la propriétaire ou la gérante seulement.","source":"Correction de la conseillère principale et de Matt (10 nov. 2026)","statut":"corrigé"},{"id":"X10","niveau":"EXPERT","theme":"Boutique et services","type":"situation","question":"Situation : un article de la circulaire est marqué « en boutique seulement ». Le client voit le prix régulier sur le site. Qu'expliques-tu?","choix":[["C'est une erreur, le rabais devrait être en ligne aussi",0],["Le rabais de cet article s'applique seulement en boutique, à la caisse; sur le site, c'est le prix régulier",1],["Le rabais commence seulement à la fin du mois",0],["Il faut un code promo en ligne",0]],"explication":"Certains articles de la circulaire ne sont pas sur le site en rabais. Pour ceux-là, le rabais est seulement en boutique, appliqué à la caisse.","source":"Promos du mois (Luna), suivi de la circulaire","statut":"OK"},{"id":"F21","niveau":"FACILE","theme":"Commandes en ligne","type":"choix","question":"Une commande en ligne fait moins de 89 $. Combien coûte la livraison?","choix":[["5 $",1],["Elle est gratuite quand même",0],["10 $",0],["15 $",0]],"explication":"La livraison est gratuite dès 89 $ d'achat. Sous 89 $, des frais de livraison de 5 $ s'appliquent.","source":"Page « Livraison » du site","statut":"OK"},{"id":"F22","niveau":"FACILE","theme":"Commandes en ligne","type":"choix","question":"Un client demande : « Livrez-vous à Saint-Lambert? » Comment le vérifier rapidement?","choix":[["Sur la page « Livraison » du site (liste des 34 municipalités et vérificateur de zone), ou en le demandant à Luna",1],["Il faut appeler le livreur",0],["On livre partout au Québec, pas besoin de vérifier",0],["Seulement en regardant une carte routière",0]],"explication":"Nous livrons dans 34 municipalités de la région de Lévis, de Bellechasse et des environs. La page « Livraison » du site a la liste complète et un vérificateur de zone, et Luna peut aussi répondre. Saint-Lambert fait partie de la liste.","source":"Page « Livraison » du site","statut":"OK"},{"id":"F23","niveau":"FACILE","theme":"Commandes en ligne","type":"choix","question":"Qui prépare les commandes faites sur le site?","choix":[["L'équipe de la boutique de Sainte-Marie, pour le livreur",1],["Un entrepôt à Québec",0],["Le livreur, quand il arrive",0],["Postes Canada",0]],"explication":"Les commandes en ligne sont préparées à la boutique de Sainte-Marie par l'équipe, prêtes pour le livreur. C'est une tâche de tous les jours pour chaque employé·e en boutique.","source":"Page « Livraison » du site (« Notre équipe la prépare en boutique »); règle de la boutique (Matt, 15 nov. 2026)","statut":"OK"},{"id":"F24","niveau":"FACILE","theme":"Commandes en ligne","type":"vf","question":"Vrai ou faux : on peut envoyer une commande par la poste à un client qui habite à Montréal.","choix":[["Vrai",0],["Faux",1]],"explication":"Faux. Nous faisons seulement de la livraison locale, sans expédition postale. Une commande placée en dehors de notre territoire est annulée et remboursée en totalité, et le client peut venir la chercher en boutique, à St-Henri ou à Sainte-Marie.","source":"Pages « Livraison » et « Expédition et retours » du site","statut":"OK"},{"id":"M21","niveau":"MOYEN","theme":"Commandes en ligne","type":"choix","question":"À quelle heure le livreur arrive-t-il à la boutique de Sainte-Marie pour prendre les commandes en ligne?","choix":[["12 h 30",1],["9 h 30, à l'ouverture",0],["13 h pile",0],["15 h",0]],"explication":"Le livreur arrive vers 12 h 30. Les commandes doivent donc être prêtes avant son arrivée. Il repart seulement après 13 h : à 13 h, on vérifie s'il reste des commandes de dernière minute à préparer avant que les livraisons partent.","source":"Règle de la boutique (Matt, 15 nov. 2026)","statut":"OK"},{"id":"M22","niveau":"MOYEN","theme":"Commandes en ligne","type":"choix","question":"Pourquoi le livreur ne repart-il qu'après 13 h?","choix":[["Parce que toute commande passée avant 13 h doit être livrée la journée même : on attend les dernières commandes",1],["Parce que c'est son heure de dîner",0],["Parce que la boutique ferme à 13 h",0],["Il n'y a pas de raison, c'est une habitude",0]],"explication":"Notre politique : une commande passée avant 13 h est livrée la journée même. Le livreur attend donc jusqu'après 13 h pour partir avec les commandes de dernière minute. Une commande qui arrive entre 12 h 30 et 13 h doit être préparée tout de suite.","source":"Page « Livraison » du site; règle de la boutique (Matt, 15 nov. 2026)","statut":"OK"},{"id":"M23","niveau":"MOYEN","theme":"Commandes en ligne","type":"choix","question":"Qu'est-ce qu'on fait en premier, au début de son quart de travail, avec les commandes en ligne?","choix":[["On prépare d'abord les commandes arrivées pendant la nuit (avant l'ouverture)",1],["J'arrive plus tôt, avant l'ouverture, pour les préparer",0],["On attend que le livreur arrive pour les préparer",0],["On les prépare seulement en fin de journée",0]],"explication":"Les commandes arrivées avant l'ouverture se préparent dès le début du quart de travail. On ne vient pas les préparer avant l'heure d'ouverture : le personnel commence officiellement à travailler pendant les heures d'ouverture de la boutique. Ainsi, tout est prêt bien avant 12 h 30, et les produits sont réservés avant que des clients en boutique les achètent.","source":"Règle de la boutique (Matt, 15 nov. 2026)","statut":"OK"},{"id":"M24","niveau":"MOYEN","theme":"Commandes en ligne","type":"choix","question":"Pourquoi faut-il vérifier régulièrement les nouvelles commandes en ligne pendant la journée?","choix":[["Si un client a acheté en ligne le dernier produit en boutique, il faut le retirer de la tablette avant qu'un autre client l'achète en boutique",1],["Pour répondre aux courriels des clients",0],["Pour changer les prix sur le site",0],["Ce n'est pas nécessaire : on les regarde seulement le lendemain",0]],"explication":"Le site vend le stock de la boutique de Sainte-Marie. Si quelqu'un achète en ligne le dernier sac, il faut le mettre de côté rapidement. Sinon, un client en boutique pourrait l'acheter, et on devrait rappeler le client en ligne pour lui dire que le produit n'est plus disponible.","source":"Règle de la boutique (Matt, 15 nov. 2026)","statut":"OK"},{"id":"M25","niveau":"MOYEN","theme":"Commandes en ligne","type":"choix","question":"En préparant une commande en ligne, tu vois qu'un produit n'est plus disponible. Que fais-tu?","choix":[["On contacte d'abord le client : aucun produit n'est remplacé sans son accord",1],["Je le remplace par un produit semblable sans lui dire",0],["J'envoie la commande sans ce produit, sans rien dire",0],["J'annule toute la commande",0]],"explication":"Notre politique : si un produit est indisponible, on contacte le client d'abord, et aucun produit n'est remplacé sans son accord.","source":"Page « Livraison » du site (« Si un produit est indisponible »)","statut":"OK"},{"id":"D21","niveau":"DIFFICILE","theme":"Commandes en ligne","type":"choix","question":"Une commande en ligne arrive d'une adresse en dehors de notre territoire de livraison. Que se passe-t-il?","choix":[["On propose d'abord au client de venir la chercher en boutique. S'il ne peut pas, on annule et on rembourse la commande en totalité",1],["On la livre quand même, avec des frais de 20 $",0],["On l'envoie par la poste",0],["On l'annule tout de suite, sans prévenir le client",0]],"explication":"On ne livre pas en dehors de notre territoire. Avant d'annuler, on offre au client de venir chercher sa commande en boutique, à St-Henri ou à Sainte-Marie. S'il ne peut pas venir, on annule la commande et on la rembourse en totalité.","source":"Pages « Livraison » et « Expédition et retours » du site; ordre des étapes : règle de la boutique (Matt, 15 nov. 2026)","statut":"OK"},{"id":"D22","niveau":"DIFFICILE","theme":"Commandes en ligne","type":"choix","question":"Le livreur arrive chez un client et personne n'est à la maison. Que dit notre politique?","choix":[["Il laisse la commande à la porte et la photographie comme preuve. Seule l'équipe voit la photo, effacée après 30 jours",1],["Il rapporte la commande en boutique et le client doit venir la chercher",0],["Il la laisse chez un voisin",0],["Il annule la commande et rembourse le client",0]],"explication":"Si personne n'est à la maison, la commande est laissée à la porte et photographiée comme preuve de livraison. La photo est vue seulement par notre équipe et supprimée automatiquement après 30 jours (voir notre politique de confidentialité).","source":"Pages « Livraison » et « Expédition et retours » du site","statut":"OK"},{"id":"D23","niveau":"DIFFICILE","theme":"Commandes en ligne","type":"choix","question":"Quelles sont les grandes catégories de produits dans le menu du site?","choix":[["Chien, Chat, Petits animaux, Entretien ménager",1],["Chien, Chat, Poissons, Reptiles",0],["Nourriture, Jouets, Vêtements, Vétérinaire",0],["Chien, Chat, Chevaux, Oiseaux",0]],"explication":"Le menu du site est classé par animal : Chien, Chat, Petits animaux (rongeurs, furets et oiseaux), plus Entretien ménager. Dans Chien et Chat, on trouve ensuite Nourritures, Gâteries, Accessoires (jouets, bols, litières…), Suppléments et Soins.","source":"Menu du site lanichealuna.com (15 nov. 2026)","statut":"OK"},{"id":"D24","niveau":"DIFFICILE","theme":"Commandes en ligne","type":"choix","question":"Un client cherche sur le site les produits à 15 % de la semaine et les rabais de la circulaire du mois. Où les trouve-t-il?","choix":[["Dans « Produits de la Semaine » et dans « Spéciaux du mois »",1],["Seulement en boutique, ils ne sont pas sur le site",0],["Dans « Entretien ménager »",0],["Dans le « Calculateur de portion »",0]],"explication":"Le menu a des catégories pour les promotions : « Produits de la Semaine » (15 % du lundi au dimanche), « Spéciaux du mois » (la circulaire) et « Spéciaux & Liquidation ». Attention : certains articles de la circulaire sont « en boutique seulement » et ne sont pas en rabais sur le site.","source":"Menu du site (15 nov. 2026); Promos du mois (Luna)","statut":"OK"},{"id":"X24","niveau":"EXPERT","theme":"Commandes en ligne","type":"situation","question":"Situation : il est 12 h 50. Une nouvelle commande en ligne vient d'arriver, et le livreur attend déjà. Que fais-tu?","choix":[["Je la prépare tout de suite : elle est passée avant 13 h, donc elle part avec le livreur aujourd'hui",1],["Je la garde pour demain, le livreur est déjà là",0],["Je demande au client de venir la chercher",0],["Je l'ignore jusqu'à ce que le livreur parte",0]],"explication":"Toute commande passée avant 13 h est livrée la journée même. C'est justement pour ça que le livreur repart seulement après 13 h. On la prépare en priorité et on la lui remet avant son départ.","source":"Page « Livraison » du site; règle de la boutique (Matt, 15 nov. 2026)","statut":"OK"},{"id":"X25","niveau":"EXPERT","theme":"Commandes en ligne","type":"situation","question":"Situation : tu vois une commande en ligne pour le dernier sac d'une nourriture, au moment où un client en boutique regarde ce même sac. Que fais-tu?","choix":[["Le sac revient à la commande en ligne, déjà payée : je le mets de côté. Je vérifie si l'autre boutique en a et je propose au client un transfert, en le contactant dès que le sac arrive",1],["Je le vends au client en boutique : il est là, devant moi",0],["J'annule la commande en ligne sans prévenir",0],["Je laisse les deux clients s'entendre entre eux",0]],"explication":"La commande en ligne a été passée et payée en premier : on retire le sac de la tablette pour elle. Pour le client en boutique, on vérifie le stock de l'autre boutique (bouton Scanner ou « Stock en boutique » de Luna). S'il y en a, on lui propose de le faire transférer et on le contacte dès qu'il arrive (habituellement le lendemain). Sinon, on lui propose un produit semblable. C'est pour éviter ce genre de situation qu'on vérifie les commandes régulièrement.","source":"Règle de la boutique (Matt, 15 nov. 2026); outil « Stock en boutique » de Luna","statut":"OK"},{"id":"X21","niveau":"EXPERT","theme":"Acides aminés","type":"choix","question":"Qu'est-ce qu'un acide aminé?","choix":[["Une petite molécule qui sert de brique pour fabriquer les protéines",1],["Un type de gras qui donne de l'énergie au corps",0],["Une vitamine fabriquée par l'intestin",0],["Un sucre qu'on trouve surtout dans les céréales",0]],"explication":"Les protéines sont de longues chaînes d'acides aminés, un peu comme un collier de perles. Il existe une vingtaine d'acides aminés dans les protéines : leur ordre et leur combinaison donnent des protéines différentes (muscle, poil, enzymes, anticorps…). À ne pas confondre avec les acides gras, qui sont des gras.","source":"Manuel vétérinaire Merck et notions générales de nutrition","statut":"OK"},{"id":"X22","niveau":"EXPERT","theme":"Acides aminés","type":"choix","question":"Un chien mange de la viande (donc des protéines). Que fait son corps avec ces protéines?","choix":[["La digestion les coupe en acides aminés, que le corps absorbe puis utilise pour fabriquer ses propres protéines",1],["Elles passent telles quelles dans le sang et deviennent directement du muscle",0],["Elles sont toutes transformées en sucre, c'est leur seul usage",0],["Elles ne sont pas absorbées : seuls les gras de la viande comptent",0]],"explication":"Pendant la digestion, les protéines de la nourriture sont coupées en acides aminés. Le corps les absorbe, puis les assemble de nouveau pour fabriquer ses propres protéines : muscles, peau, poil, enzymes, hormones, anticorps. Ce qui n'est pas utilisé peut servir d'énergie. C'est pourquoi la qualité des acides aminés d'une nourriture compte autant que son pourcentage de protéines.","source":"Notions générales de nutrition animale (Manuel vétérinaire Merck)","statut":"OK"},{"id":"X23","niveau":"EXPERT","theme":"Acides aminés","type":"choix","question":"Que veut dire le mot « essentiel » pour un acide aminé?","choix":[["Le corps ne peut pas le fabriquer (ou pas assez) : il doit venir de la nourriture",1],["Il est plus important que les autres acides aminés",0],["On le trouve seulement dans la viande",0],["Il sert seulement aux chiots et aux chatons",0]],"explication":"Tous les acides aminés servent. Un acide aminé « essentiel » est un acide aminé que l'animal ne peut pas fabriquer (ou pas en assez grande quantité) : il doit venir de la nourriture. Un acide aminé « non essentiel » peut être fabriqué par le corps. Le chien a 10 acides aminés essentiels, le chat en a 11 (avec la taurine).","source":"Manuel vétérinaire Merck (nutrition des petits animaux)","statut":"OK"},{"id":"E1","niveau":"EXTRA","theme":"Acides aminés","type":"choix","question":"Combien d'acides aminés sont essentiels dans l'alimentation du chat, et lequel s'ajoute à la liste du chien?","choix":[["10, les mêmes que le chien",0],["11 : la taurine s'ajoute aux 10 du chien",1],["11 : la glycine s'ajoute aux 10 du chien",0],["12 : la taurine et la cystéine s'ajoutent aux 10 du chien",0]],"explication":"Le chien a 10 acides aminés essentiels (arginine, histidine, isoleucine, leucine, lysine, méthionine, phénylalanine, thréonine, tryptophane, valine). Le chat a les mêmes, plus la taurine : 11 en tout.","source":"Manuel vétérinaire Merck (nutrition des petits animaux)","statut":"OK"},{"id":"E2","niveau":"EXTRA","theme":"Acides aminés","type":"vf","question":"Vrai ou faux : la taurine est un acide aminé essentiel pour le chien, comme pour le chat.","choix":[["Vrai",0],["Faux",1]],"explication":"Faux. Le chien fabrique normalement sa taurine à partir de la méthionine et de la cystéine, donc elle n'est pas sur sa liste d'acides aminés essentiels. Mais il peut quand même en manquer si la nourriture est pauvre en acides aminés soufrés : un chien peut alors développer une carence en taurine.","source":"WikiVet et Manuel Merck (NRC 2006)","statut":"OK"},{"id":"E3","niveau":"EXTRA","theme":"Acides aminés","type":"choix","question":"Pourquoi le chat perd-il de la taurine en permanence, même quand il mange bien?","choix":[["Il l'utilise seulement pour fabriquer ses sels biliaires, et il la perd dans les selles",1],["Il l'élimine dans l'urine en grande quantité",0],["La chaleur de la digestion la détruit",0],["Il l'utilise seulement pour fabriquer sa vitamine D",0]],"explication":"Le chat n'utilise que la taurine pour former ses sels biliaires : contrairement au chien, il ne peut pas passer à la glycine. Une partie de la taurine part donc dans les selles à chaque digestion, et il doit en recevoir chaque jour par la nourriture.","source":"VCA Hospitals, WikiVet (taurine)","statut":"OK"},{"id":"E4","niveau":"EXTRA","theme":"Acides aminés","type":"choix","question":"Une carence en taurine cause deux maladies graves chez le chat. Laquelle des phrases est vraie?","choix":[["Cardiomyopathie dilatée (souvent réversible si traitée tôt) et dégénérescence de la rétine (cécité, en général irréversible)",1],["Insuffisance rénale et calculs urinaires, les deux réversibles",0],["Perte de poils et diabète, les deux irréversibles",0],["Diarrhée chronique seulement, sans danger pour le cœur ni les yeux",0]],"explication":"La carence en taurine cause une cardiomyopathie dilatée et une dégénérescence centrale de la rétine. Le cœur récupère souvent si on corrige tôt (taurine et nourriture), mais les dommages à la rétine sont généralement permanents. C'est rare aujourd'hui parce que les nourritures commerciales complètes contiennent de la taurine ajoutée.","source":"Manuel Merck; VCA Hospitals (taurine chez le chat)","statut":"OK"},{"id":"E5","niveau":"EXTRA","theme":"Acides aminés","type":"choix","question":"Un chat qui reçoit une nourriture totalement sans arginine peut devenir gravement malade en quelques heures. Pourquoi?","choix":[["Son cycle de l'urée reste actif en permanence : sans arginine, l'ammoniac s'accumule",1],["L'arginine est la seule source d'énergie de ses muscles",0],["Sans arginine, il ne peut plus digérer les gras",0],["Sans arginine, ses reins cessent de filtrer le sel",0]],"explication":"L'arginine fait fonctionner le cycle de l'urée, qui transforme l'ammoniac en urée. Le chat ne « ralentit » pas ce cycle quand il mange peu de protéines ou jeûne, et il fabrique peu d'arginine dans son intestin : sans arginine, l'ammoniac s'accumule et peut devenir toxique très vite. C'est la carence la plus rapide connue chez un mammifère. Les besoins en arginine du chat sont aussi plus élevés que ceux du chien.","source":"WikiVet (arginine); revue de Morris (1985); cas clinique 2018 (JFMS Open Reports)","statut":"OK"},{"id":"E6","niveau":"EXTRA","theme":"Acides aminés","type":"choix","question":"Le chat reçoit beaucoup de tryptophane (un acide aminé) dans sa nourriture, mais on doit quand même lui fournir de la niacine (vitamine B3). Pourquoi?","choix":[["Il transforme très peu de tryptophane en niacine : une enzyme détourne le tryptophane ailleurs",1],["Le tryptophane ne se digère pas chez le chat",0],["La niacine remplace la taurine dans son corps",0],["Le chien a le même besoin, c'est une règle générale",0]],"explication":"Chez beaucoup d'espèces, le corps fabrique de la niacine à partir du tryptophane. Le chat le fait très peu (une enzyme très active envoie le tryptophane vers la production d'énergie), donc manger plus de tryptophane ne couvre pas son besoin en niacine : il en faut dans la nourriture. Le chien en fabrique davantage.","source":"WikiVet (tryptophane et niacine)","statut":"OK"},{"id":"E7","niveau":"EXTRA","theme":"Acides aminés","type":"choix","question":"La chaleur de la cuisson (extrusion, mise en conserve) peut rendre un acide aminé moins disponible par la réaction de Maillard. Lequel est le plus touché?","choix":[["La lysine",1],["La taurine",0],["Le tryptophane",0],["La glycine",0]],"explication":"Pendant la cuisson, la lysine se lie aux sucres (réaction de Maillard) et devient inutilisable. On parle de lysine « réactive » (encore disponible) versus lysine totale. Dans une étude de 153 aliments, le rapport moyen était d'environ 0,9 pour les croquettes et les conserves pour chat, mais plus bas dans certains aliments : un produit peut donc afficher assez de lysine sur le papier et en offrir moins en pratique, ce qui compte surtout pour un animal en croissance.","source":"Étude sur la lysine réactive dans les aliments pour animaux (PMC4473178)","statut":"OK"},{"id":"E10","niveau":"EXTRA","theme":"Acides aminés","type":"situation","question":"Situation : une cliente veut nourrir son chat avec une alimentation sans viande, « faite de légumineuses et de céréales ». Que lui dis-tu?","choix":[["Les protéines végétales ne contiennent pas de taurine : le chat a besoin de protéines animales ou de taurine synthétique ajoutée. Je propose une nourriture complète pour chats et je suggère d'en parler à son vétérinaire",1],["Pas de problème : le chat fabrique toute sa taurine lui-même",0],["Il suffit d'ajouter plus de légumineuses riches en protéines",0],["C'est correct, mais seulement pour un chat adulte en bonne santé",0]],"explication":"Les protéines végétales ne contiennent pas de taurine, et le chat n'en fabrique pas assez : il lui faut des protéines animales ou de la taurine synthétique ajoutée. Un menu fait à la maison sans produit animal risque de causer une carence (cœur, rétine). On reste sur une nourriture commerciale complète et équilibrée pour chats, et on invite la cliente à en parler à son vétérinaire.","source":"Manuel vétérinaire Merck — à confirmer : la manière de répondre en boutique (ton et conseil) est à valider par la conseillère","statut":"OK"},{"id":"E11","niveau":"EXTRA","theme":"Acides aminés","type":"choix","question":"L'arginine est essentielle pour le chien, même si son besoin est plus faible que celui du chat. Pourquoi ne peut-il pas la fabriquer lui-même en quantité suffisante?","choix":[["Il fabrique mal la citrulline (le précurseur de l'arginine) dans son intestin grêle",1],["Il n'a pas de foie assez gros pour la fabriquer",0],["Il la détruit entièrement dans l'estomac, avant l'absorption",0],["Il fabrique assez d'arginine, mais il la perd dans l'urine",0]],"explication":"Le chien est un peu moins exigeant que le chat pour l'arginine, mais il synthétise mal la citrulline dans l'intestin grêle, et sans citrulline il ne peut pas produire assez d'arginine. Elle fait donc partie des 10 acides aminés qui doivent venir de la nourriture.","source":"Revue « Amino acid nutrition and metabolism in domestic cats and dogs » (FAO/AGRIS) et Journal of Animal Science and Biotechnology (2023)","statut":"OK"},{"id":"E12","niveau":"EXTRA","theme":"Acides aminés","type":"choix","question":"Même si le chien fabrique sa taurine, certaines races sont plus à risque d'en manquer. Lesquelles sont décrites comme prédisposées?","choix":[["Golden retriever et cocker spaniel américain (et, dans une étude, le terre-neuve)",1],["Chihuahua et yorkshire terrier",0],["Bouledogue français et carlin",0],["Border collie et berger australien",0]],"explication":"Les revues décrivent une prédisposition chez le golden retriever et le cocker spaniel américain (activité plus faible de certaines enzymes du foie), et une étude rapporte 1,3 à 2,5 % de carence en taurine chez des terre-neuve nourris avec des aliments commerciaux équilibrés. La grande majorité des chiens fabriquent assez de taurine.","source":"Revue PMC6396252 et Journal of Animal Science and Biotechnology (2023) — à confirmer : liste des races selon les sources","statut":"OK"},{"id":"E13","niveau":"EXTRA","theme":"Acides aminés","type":"situation","question":"Situation : le propriétaire d'un golden retriever demande : « Mon chien a-t-il besoin de taurine ajoutée dans sa nourriture? » Que réponds-tu?","choix":[["Le chien fabrique normalement sa taurine, mais le golden y est prédisposé et la cause des carences est multiple et débattue. Je ne promets rien et je suggère d'en parler à son vétérinaire",1],["Oui, tous les chiens ont besoin de taurine ajoutée, comme les chats",0],["Non, c'est impossible : un chien ne manque jamais de taurine",0],["Seulement s'il mange une nourriture avec des grains : je lui conseille d'en changer tout de suite",0]],"explication":"Dans une étude de 2018, des golden retrievers avec une cardiomyopathie dilatée avaient une carence en taurine, et 23 sur 24 se sont améliorés avec un changement de nourriture et de la taurine. Les auteurs concluent que la cause est probablement multifactorielle (alimentation, métabolisme, génétique). On ne dit donc ni « tout va bien » ni « c'est la faute de tel ingrédient » : on écoute, on reste prudent et on réfère au vétérinaire. En boutique, on peut ajouter que beaucoup de nos nourritures pour chien (Fromm, Oven-Baked, Boréal, Horizon, Go!, Open Farm, Wholesome Blend, Stella & Chewy's, Acana, Nulo) listent de la taurine parmi leurs ingrédients, mais la fiche ne donne jamais la quantité : on ne peut donc pas promettre que ça suffit.","source":"Étude 2018 sur la carence en taurine et la cardiomyopathie dilatée chez le golden retriever (PMC6292607) — à confirmer : la formulation de la réponse en boutique","statut":"OK"},{"id":"E14","niveau":"EXTRA","theme":"Acides aminés","type":"choix","question":"Les pois, lentilles, pois chiches et haricots sont riches en lysine, mais pauvres en quel acide aminé?","choix":[["La méthionine",1],["La phénylalanine",0],["L'arginine",0],["L'isoleucine",0]],"explication":"Les légumineuses sont riches en lysine mais pauvres en méthionine. Cela compte chez le chien parce que la méthionine (avec la cystéine) sert aussi à fabriquer sa taurine : dans une recette riche en légumineuses, il faut vérifier que les acides aminés soufrés sont assez présents (apport de viandes, ou méthionine ajoutée). Ce n'est pas un défaut des légumineuses en soi : c'est l'équilibre de toute la recette qui compte.","source":"Revue PMC6396252 (acides aminés chez le chien et le chat)","statut":"OK"},{"id":"E15","niveau":"EXTRA","theme":"Acides aminés","type":"vf","question":"Vrai ou faux : une nourriture pour chien dont les protéines sont surtout végétales ne peut pas couvrir ses besoins en acides aminés essentiels.","choix":[["Vrai",0],["Faux",1]],"explication":"Faux, mais avec une nuance. Une étude (PMC7143243) n'a trouvé aucune différence de digestibilité entre les protéines végétales et animales, en tant que classes. Par contre, les protéines animales ont en général une valeur biologique plus élevée : une recette végétale doit donc être mieux formulée et contenir plus de protéines pour couvrir les mêmes besoins. Pour le chat, c'est différent : il a besoin de taurine, que les plantes ne contiennent pas (voir E10).","source":"Étude PMC7143243 (protéines végétales et animales chez le chien et le chat); revue Global Pet Industry (valeur biologique)","statut":"OK"},{"id":"E16","niveau":"EXTRA","theme":"Acides aminés","type":"choix","question":"Une protéine a une valeur biologique plus basse qu'une autre. Qu'est-ce que cela implique pour la recette d'une nourriture pour chien?","choix":[["Elle doit contenir plus de cette protéine pour couvrir les besoins en acides aminés essentiels",1],["Elle doit contenir moins de protéines au total",0],["Elle ne peut jamais être utilisée dans une nourriture complète",0],["Rien : seule la quantité totale de protéines sur l'étiquette compte",0]],"explication":"La valeur biologique mesure à quel point les acides aminés d'une protéine ressemblent à ce dont le corps a besoin. Plus elle est basse, plus il faut de cette protéine pour fournir assez de chaque acide aminé essentiel. C'est pourquoi deux aliments avec le même pourcentage de protéines sur l'étiquette ne se valent pas forcément. L'œuf sert de référence (100); les autres valeurs varient selon les sources.","source":"Global Pet Industry, « Alternative proteins in pet food » — à confirmer : les valeurs de la valeur biologique varient selon les sources","statut":"OK"},{"id":"E17","niveau":"EXTRA","theme":"Protéines et purines","type":"situation","question":"Situation : un client a un dalmatien qui a déjà eu des calculs d'urate (des cristaux d'acide urique) dans la vessie. Ces calculs viennent des purines, des composés naturels de la nourriture que le corps transforme en acide urique. Que sais-tu pour bien le conseiller?","choix":[["Le dalmatien gère mal les purines (un défaut génétique) : son vétérinaire prescrit une alimentation faible en purines, et il vaut mieux éviter les produits à base de soya, riches en purines",1],["Les calculs viennent d'un manque de calcium : il faut en ajouter à la nourriture",0],["Il faut réduire fortement l'eau qu'il boit pour concentrer l'urine",0],["Il faut lui donner de la taurine tous les jours, c'est la cause des calculs",0]],"explication":"Les purines sont des composés naturels présents dans les cellules des animaux et des plantes, donc dans la nourriture (viande, abats, soya…). En les digérant, le corps produit de l'acide urique. La plupart des chiens le transforment en une substance qui se dissout facilement dans l'urine, mais pas le dalmatien, qui en élimine beaucoup tel quel. Chez le dalmatien (et le bouledogue anglais), un défaut génétique dans la gestion des purines favorise les calculs d'urate. Le traitement et la prévention passent par une alimentation faible en purines (le soya en contient beaucoup) et suivent les directives du vétérinaire, qui peut aussi donner de l'allopurinol. On ne remplace jamais une diète vétérinaire par un produit du commerce sans son accord.","source":"UC Davis (gestion nutritionnelle des calculs), Vet Times et Whole Dog Journal — question en marge du thème des acides aminés (purines); à confirmer : la liste d'aliments à éviter par la conseillère","statut":"OK"},{"id":"E18","niveau":"EXTRA","theme":"Acides aminés","type":"choix","question":"Laquelle de ces listes est la liste complète des 10 acides aminés essentiels du chien?","choix":[["Arginine, histidine, isoleucine, leucine, lysine, méthionine, phénylalanine, thréonine, tryptophane, valine",1],["Arginine, histidine, isoleucine, leucine, lysine, méthionine, phénylalanine, thréonine, tryptophane, taurine",0],["Arginine, glycine, isoleucine, leucine, lysine, méthionine, phénylalanine, thréonine, tryptophane, valine",0],["Arginine, histidine, isoleucine, leucine, lysine, cystéine, phénylalanine, thréonine, tryptophane, valine",0]],"explication":"Les 10 acides aminés essentiels du chien : arginine, histidine, isoleucine, leucine, lysine, méthionine, phénylalanine, thréonine, tryptophane et valine. Les autres listes contiennent un intrus : la taurine (le chien la fabrique à partir de la méthionine et de la cystéine), la glycine ou la cystéine (non essentielles pour lui).","source":"Manuel vétérinaire Merck (nutrition des petits animaux); cystéine et glycine : connaissance générale en nutrition","statut":"OK"},{"id":"E19","niveau":"EXTRA","theme":"Acides aminés","type":"choix","question":"Lequel de ces acides aminés N'EST PAS essentiel pour le chien (il le fabrique lui-même)?","choix":[["La glycine",1],["L'histidine",0],["La thréonine",0],["L'isoleucine",0]],"explication":"La glycine n'est pas essentielle : le chien la fabrique lui-même. L'histidine, la thréonine et l'isoleucine font partie des 10 acides aminés essentiels du chien, qui doivent venir de la nourriture. Un acide aminé non essentiel peut devenir nécessaire dans certaines maladies (on parle d'acide aminé conditionnellement essentiel).","source":"Manuel vétérinaire Merck (nutrition des petits animaux)","statut":"OK"},{"id":"E20","niveau":"EXTRA","theme":"Acides aminés","type":"choix","question":"Laquelle de ces listes est la liste complète des 11 acides aminés essentiels du chat?","choix":[["Arginine, histidine, isoleucine, leucine, lysine, méthionine, phénylalanine, taurine, thréonine, tryptophane, valine",1],["Arginine, glycine, isoleucine, leucine, lysine, méthionine, phénylalanine, taurine, thréonine, tryptophane, valine",0],["Alanine, arginine, histidine, isoleucine, leucine, méthionine, phénylalanine, taurine, thréonine, tryptophane, valine",0],["Acide glutamique, arginine, histidine, isoleucine, leucine, lysine, méthionine, phénylalanine, taurine, thréonine, valine",0]],"explication":"Le chat a les 10 acides aminés essentiels du chien (arginine, histidine, isoleucine, leucine, lysine, méthionine, phénylalanine, thréonine, tryptophane, valine) et, en plus, la taurine : 11 en tout. Les autres listes remplacent un vrai acide aminé essentiel par un intrus (glycine, alanine ou acide glutamique) que le chat fabrique lui-même.","source":"Manuel vétérinaire Merck (nutrition des petits animaux)","statut":"OK"},{"id":"E21","niveau":"EXTRA","theme":"Acides aminés","type":"vf","question":"Vrai ou faux : la taurine sert à construire des protéines, comme les autres acides aminés essentiels.","choix":[["Vrai",0],["Faux",1]],"explication":"Faux. Contrairement aux autres acides aminés de la liste, la taurine n'entre pas dans la fabrication des protéines : c'est un acide aminé « libre » (techniquement un acide aminosulfonique). Elle sert à d'autres choses, comme former les sels biliaires, et elle est importante pour le cœur et la rétine du chat (voir E3 et E4).","source":"Manuel vétérinaire Merck et WikiVet (taurine) — à confirmer : le détail « acide aminosulfonique » est une notion de biochimie générale","statut":"OK"},{"id":"E22","niveau":"EXTRA","theme":"Peptides","type":"choix","question":"Qu'est-ce qu'un peptide?","choix":[["Une courte chaîne d'acides aminés, plus petite qu'une protéine",1],["Un seul acide aminé, à l'état libre",0],["Un type de gras comme les oméga-3",0],["Une vitamine qui aide à digérer les protéines",0]],"explication":"Un peptide, c'est au moins deux acides aminés attachés ensemble. Quand la chaîne devient très longue (souvent une centaine d'acides aminés ou plus) et se replie en forme 3D, on parle de protéine. Il n'y a pas de limite officielle unique : les scientifiques n'utilisent pas tous le même seuil.","source":"Institute for Molecular Bioscience, Université du Queensland; Britannica (peptide ou protéine)","statut":"OK"},{"id":"E23","niveau":"EXTRA","theme":"Peptides","type":"choix","question":"Dans quel ordre, du plus petit au plus grand?","choix":[["Acide aminé → peptide → protéine",1],["Peptide → acide aminé → protéine",0],["Protéine → peptide → acide aminé",0],["Acide aminé → protéine → peptide",0]],"explication":"L'acide aminé est la brique. Quelques briques attachées forment un peptide. Une longue chaîne repliée forme une protéine. La digestion fait le chemin inverse : protéine → peptides → acides aminés, qui sont absorbés.","source":"Institute for Molecular Bioscience, Université du Queensland; Britannica","statut":"OK"},{"id":"E24","niveau":"EXTRA","theme":"Peptides","type":"vf","question":"Vrai ou faux : un peptide, c'est forcément un médicament ou une hormone.","choix":[["Vrai",0],["Faux",1]],"explication":"Faux. « Peptide » décrit une taille de molécule, pas un usage. Certaines hormones et certains médicaments sont des peptides, mais la digestion de n'importe quelle viande produit aussi des peptides chaque jour. Dans la nourriture, les peptides viennent surtout de protéines « coupées » (hydrolysées).","source":"Institute for Molecular Bioscience, Université du Queensland; notions générales de biochimie","statut":"OK"},{"id":"E25","niveau":"EXTRA","theme":"Peptides","type":"choix","question":"Qu'est-ce qu'une protéine « hydrolysée »?","choix":[["Une protéine coupée en petits morceaux (peptides) par des enzymes",1],["Une protéine à laquelle on a ajouté de l'eau pour la rendre humide",0],["Une protéine végétale qui remplace la viande",0],["Une protéine chauffée pour la rendre croustillante",0]],"explication":"L'hydrolyse coupe la protéine en peptides avec des enzymes. Dans les diètes vétérinaires hydrolysées, le but est que les morceaux soient trop petits pour être reconnus par le système immunitaire, ce qui sert dans les essais d'élimination pour les allergies alimentaires. « Hydro » ne veut pas dire « avec de l'eau » dans la nourriture.","source":"Fiche « Dog and cat foods with hydrolysed protein » (vetsandclinics); Masuda et al. 2020 (J Vet Med Sci)","statut":"OK"},{"id":"E26","niveau":"EXTRA","theme":"Peptides","type":"situation","question":"Situation : un client a un chien allergique au poulet. Il voit « poulet hydrolysé » comme premier ingrédient du Fromm Nutritionnel Digestive Poulet et demande si c'est une nourriture hypoallergénique. Que réponds-tu?","choix":[["Non : la recette contient aussi de la farine de poulet. Je demande à quoi le chien est allergique et si c'est confirmé par le vétérinaire, pour l'orienter vers une nourriture sans poulet ou vers une diète vétérinaire",1],["Oui : « hydrolysé » veut dire que toute allergie au poulet disparaît",0],["Oui, si on la donne seulement deux semaines",0],["Non, parce qu'une protéine hydrolysée est toujours plus allergène",0]],"explication":"La fiche du Fromm Nutritionnel Digestive Poulet liste « poulet hydrolysé » puis « farine de poulet » (du poulet non hydrolysé). Une nourriture du commerce avec un ingrédient hydrolysé n'est pas une diète d'élimination. De plus, la fiche ne dit pas à quel point le poulet est coupé. Avant de conseiller, on pose des questions : à quoi le chien réagit (poulet seulement? plusieurs protéines?), quels signes il a (démangeaisons, digestion) et si c'est confirmé par le vétérinaire. Allergie connue à une seule protéine : on cherche une nourriture sans aucune forme de cette protéine (bouton « Allergie / sans X » de Luna). Allergie pas encore confirmée ou à plusieurs protéines : le vétérinaire fait un essai d'élimination strict de 8 à 12 semaines, souvent avec une diète hydrolysée vétérinaire. Même chose pour le Fromm Nutritionnel Peau & Estomac Sensible (saumon hydrolysé).","source":"Fiches Fromm Nutritionnel Digestive Poulet et Peau & Estomac Sensible (site); vetsandclinics (essai d'élimination de 8 à 12 semaines) — à confirmer : la formulation en boutique","statut":"OK"},{"id":"E27","niveau":"EXTRA","theme":"Peptides","type":"vf","question":"Vrai ou faux : une diète hydrolysée vétérinaire règle à coup sûr toutes les allergies alimentaires.","choix":[["Vrai",0],["Faux",1]],"explication":"Faux. Une étude de 2020 a trouvé, dans deux diètes hydrolysées commerciales, des morceaux de protéines plus gros que prévu, capables d'activer les cellules immunitaires de certains chiens allergiques. Ces diètes aident beaucoup de chiens, mais pas tous : c'est pourquoi le suivi se fait avec le vétérinaire.","source":"Masuda et al. 2020, Journal of Veterinary Medical Science","statut":"OK"},{"id":"E28","niveau":"EXTRA","theme":"Peptides","type":"choix","question":"Le Livstrong Support de collagène contient de l'« hydrolysat de collagène », c'est-à-dire des peptides de collagène. Quelle phrase est la plus juste?","choix":[["Quelques petites études chez le chien montrent un effet possible sur la mobilité, mais les preuves restent limitées. Ce n'est pas la même chose que le collagène non dénaturé (UC-II)",1],["C'est prouvé : il remplace les anti-inflammatoires chez tous les chiens arthritiques",0],["Il n'a aucun lien avec le collagène : c'est un nom commercial",0],["C'est exactement le même produit que le collagène non dénaturé (UC-II), juste sous un autre nom",0]],"explication":"L'hydrolysat de collagène, c'est du collagène coupé en peptides (aussi dans Omega Alpha SinewPet). Les études chez le chien sont petites et les résultats mitigés (certaines montrent une meilleure démarche, d'autres aucun changement mesurable). Le collagène non dénaturé (UC-II) est différent : il est gardé intact et agirait autrement, par le système immunitaire de l'intestin. Aucun des deux ne remplace le suivi vétérinaire de l'arthrose.","source":"Fiches Livstrong Support de collagène et Omega Alpha SinewPet (site); Veterinary Practice News (suppléments pour l'arthrose); Stabile et al. 2019 (UC-II)","statut":"OK"},{"id":"E29","niveau":"EXTRA","theme":"Peptides","type":"situation","question":"Situation : un client a vu sur internet des « peptides » en injection (par exemple BPC-157) pour aider son chien à guérir d'une blessure. Il te demande si c'est une bonne idée. Que réponds-tu?","choix":[["Ce n'est pas un supplément : ce n'est pas approuvé pour les animaux, les données viennent surtout d'études sur des rongeurs et la qualité des produits varie. Je lui conseille d'en parler à son vétérinaire",1],["C'est un supplément naturel comme le collagène, donc sans risque",0],["C'est approuvé pour les chiens, on peut lui en commander",0],["Il suffit de mélanger le produit à la nourriture pour qu'il fonctionne",0]],"explication":"Le mot « peptide » est à la mode, mais un peptide injectable de « recherche » n'a rien à voir avec un supplément alimentaire. Le BPC-157 n'est pas approuvé pour usage vétérinaire, il n'y a pas d'essai contrôlé publié chez le chien, et la pureté des produits vendus en ligne varie beaucoup. On ne conseille jamais ce genre de produit : on réfère au vétérinaire.","source":"Articles de vétérinaires et revues en ligne sur le BPC-157 chez le chien (sources secondaires) — à confirmer : la position de la boutique et la formulation","statut":"OK"}]</script>

        { id: 'DIFFICILE', nom: 'Difficile', c: '#c2410c', f: '#ffeee3', desc: "Conseiller un client avec les listes de l'équipe : articulations, digestion, perte de poids, portions." },
        { id: 'EXPERT', nom: 'Expert', c: '#b3261e', f: '#fdecea', desc: 'De vrais cas de clients où plusieurs règles se mélangent.' },
        { id: 'EXTRA', nom: 'Expert Extra', c: '#5b21b6', f: '#f1e9ff', desc: "Pour le personnel d'expérience : des questions pointues, en commençant par les acides aminés.",
          conseil: "💡 Conseil : fais d'abord le niveau Expert, il rappelle les bases sur les acides aminés." }
      ];
      var RAFRAICHIR = { id: 'MIX', nom: 'Rafraîchissement', c: '#1B6FB8', f: '#e8f1fa', desc: '5 questions mélangées de tous les niveaux. Pour garder ses connaissances à jour.' };
      var NB_RAFRAICHIR = 5;

      var zone = document.getElementById('formation-contenu');
      var quiz = null; // { niveau, titre, liste, i, bonnes, ratees, choix, repondu }

      function melanger(a) {
        a = a.slice();
        for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
        return a;
      }
      function el(tag, cls, texte) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (texte != null) e.textContent = texte;
        return e;
      }
      function couleurs(e, n) { e.style.setProperty('--c', n.c); e.style.setProperty('--f', n.f); return e; }
      function bouton(texte, cls, action) { var b = el('button', cls, texte); b.type = 'button'; b.addEventListener('click', action); return b; }
      function vider() { zone.innerHTML = ''; formation.scrollTop = 0; }
      function niveau(id) { for (var i = 0; i < NIVEAUX.length; i++) if (NIVEAUX[i].id === id) return NIVEAUX[i]; return RAFRAICHIR; }

      // 1. Choisir un niveau
      function menu() {
        quiz = null;
        vider();
        zone.appendChild(el('h1', '', '🎓 Formation'));
        zone.appendChild(el('p', '', 'Choisis un niveau. Après chaque réponse, lis l\'explication : c\'est là qu\'on apprend.'));
        if (!Q.length) { zone.appendChild(el('p', '', 'Aucune question approuvée pour le moment.')); return; }
        var grille = el('div', 'grille');
        NIVEAUX.forEach(function (n) {
          var nb = Q.filter(function (q) { return q.niveau === n.id; }).length;
          if (!nb) return;
          grille.appendChild(carte(n, nb + ' questions', function () { themes(n); }));
        });
        grille.appendChild(carte(RAFRAICHIR, NB_RAFRAICHIR + ' questions', function () {
          demarrer(RAFRAICHIR, 'Rafraîchissement', melanger(QMIX).slice(0, NB_RAFRAICHIR));
        }));
        zone.appendChild(grille);
        zone.appendChild(el('p', 'petit', 'Pratique seulement : aucun nom ni résultat n\'est enregistré. Les réponses ont été approuvées par la boutique.'));
      }
      function carte(n, nb, action) {
        var b = couleurs(bouton('', 'carte', action), n);
        b.appendChild(el('div', 'nom', n.nom));
        b.appendChild(el('div', 'desc', n.desc));
        if (n.conseil) b.appendChild(el('div', 'conseil', n.conseil));
        b.appendChild(el('div', 'nb', nb));
        return b;
      }

      // 2. Choisir un thème (ou tous)
      function themes(n) {
        var duNiveau = Q.filter(function (q) { return q.niveau === n.id; });
        var noms = [];
        duNiveau.forEach(function (q) { if (noms.indexOf(q.theme) === -1) noms.push(q.theme); });
        if (noms.length < 2) { demarrer(n, n.nom, melanger(duNiveau)); return; }
        vider();
        zone.appendChild(bouton('← Niveaux', 'lien', menu));
        var h = el('h1', '', 'Niveau ' + n.nom); h.style.color = n.c; zone.appendChild(h);
        if (n.conseil) zone.appendChild(couleurs(el('div', 'note-conseil', n.conseil), n));
        zone.appendChild(el('p', '', 'Quel thème veux-tu pratiquer?'));
        var puces = el('div', 'puces');
        puces.appendChild(bouton('Tous les thèmes (' + duNiveau.length + ')', 'puce', function () { demarrer(n, n.nom, melanger(duNiveau)); }));
        noms.forEach(function (t) {
          var liste = duNiveau.filter(function (q) { return q.theme === t; });
          puces.appendChild(bouton(t + ' (' + liste.length + ')', 'puce', function () { demarrer(n, n.nom + ' · ' + t, melanger(liste)); }));
        });
        zone.appendChild(puces);
      }

      // 3. Le quiz
      function demarrer(n, titre, liste) {
        quiz = { niveau: n, titre: titre, liste: liste, i: 0, bonnes: 0, ratees: [] };
        question();
      }
      function question() {
        var q = quiz.liste[quiz.i];
        quiz.repondu = false;
        quiz.choix = q.type === 'vf' ? q.choix.slice() : melanger(q.choix);
        vider();
        var entete = el('div', 'entete');
        entete.appendChild(el('div', 'petit', quiz.titre + ' — question ' + (quiz.i + 1) + ' sur ' + quiz.liste.length));
        entete.appendChild(bouton('✕ Quitter', 'lien', function () {
          if (confirm('Quitter ce quiz? Ton résultat ne sera pas gardé.')) menu();
        }));
        zone.appendChild(entete);
        var barre = el('div', 'progression'); var plein = el('div'); plein.style.width = (quiz.i / quiz.liste.length * 100) + '%';
        barre.appendChild(plein); zone.appendChild(barre);
        var n = niveau(q.niveau);
        zone.appendChild(couleurs(el('span', 'etiquette', n.nom), n));
        zone.appendChild(el('span', 'petit', q.theme));
        zone.appendChild(el('div', 'question', q.question));
        var choix = el('div', 'choix');
        quiz.choix.forEach(function (c, k) {
          var b = bouton('', '', function () { repondre(k, choix); });
          b.appendChild(el('span', 'lettre', LETTRES[k] + ')'));
          b.appendChild(el('span', '', c[0]));
          choix.appendChild(b);
        });
        zone.appendChild(choix);
      }
      function repondre(k, choix) {
        if (quiz.repondu) return;
        quiz.repondu = true;
        var q = quiz.liste[quiz.i];
        var bon = quiz.choix[k][1] === 1;
        if (bon) quiz.bonnes++; else quiz.ratees.push(q);
        var boutons = choix.querySelectorAll('button');
        quiz.choix.forEach(function (c, j) {
          boutons[j].disabled = true;
          if (c[1] === 1) boutons[j].classList.add('bonne');
          else if (j === k) boutons[j].classList.add('mauvaise');
          else boutons[j].classList.add('attenue');
        });
        var retour = el('div', 'retour ' + (bon ? 'ok' : 'non'));
        retour.appendChild(el('div', 'verdict', bon ? '✅ Bonne réponse!' : '❌ Pas tout à fait.'));
        retour.appendChild(el('p', '', q.explication));
        zone.appendChild(retour);
        var derniere = quiz.i === quiz.liste.length - 1;
        var suite = el('div', 'boutons');
        suite.appendChild(bouton(derniere ? 'Voir mon résultat' : 'Question suivante →', 'bouton', function () {
          if (derniere) fin(); else { quiz.i++; question(); }
        }));
        zone.appendChild(suite);
        setTimeout(function () { retour.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); suite.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 50);
      }

      // 4. Résultat (affiché seulement, jamais enregistré)
      function fin() {
        var total = quiz.liste.length, b = quiz.bonnes, pct = b / total;
        vider();
        zone.appendChild(el('h1', '', quiz.titre));
        zone.appendChild(el('div', 'score', b + ' / ' + total));
        zone.appendChild(el('p', '', pct === 1 ? (quiz.niveau.id === 'MIX' ? '🏆 Parfait! Tes connaissances sont à jour.' : '🏆 Parfait! Tu maîtrises ce niveau.')
          : pct >= 0.8 ? '👏 Très bien! Relis les questions manquées ci-dessous.'
          : pct >= 0.5 ? '👍 Pas mal! Relis les explications ci-dessous, puis réessaie.'
          : '💪 Continue de pratiquer : relis les explications ci-dessous et refais le quiz.'));
        var liste = quiz.liste, n = quiz.niveau, titre = quiz.titre;
        var boutons = el('div', 'boutons');
        boutons.appendChild(bouton('Refaire ce quiz', 'bouton', function () {
          demarrer(n, titre, n.id === 'MIX' ? melanger(QMIX).slice(0, NB_RAFRAICHIR) : melanger(liste));
        }));
        boutons.appendChild(bouton('Choisir un autre niveau', 'bouton secondaire', menu));
        zone.appendChild(boutons);
        var note = el('div', 'note-discussion');
        note.appendChild(el('span', '', '💬 '));
        note.appendChild(el('b', '', 'Ce quiz sert surtout à lancer la discussion'));
        note.appendChild(document.createTextNode(' sur les politiques et les valeurs de la boutique. Il y a souvent d\'autres bonnes réponses que celles de la liste : parlez-en entre vous pour vous aider à les trouver.'));
        zone.appendChild(note);
        if (quiz.ratees.length) {
          zone.appendChild(el('h2', '', 'À revoir'));
          quiz.ratees.forEach(function (q) {
            var r = el('div', 'revoir');
            r.appendChild(el('div', 'q', q.question));
            var bonne = q.choix.filter(function (c) { return c[1] === 1; })[0];
            r.appendChild(el('div', 'r', '✔ ' + bonne[0]));
            r.appendChild(el('div', 'e', q.explication));
            zone.appendChild(r);
          });
        }
      }

      menu();
    })();
  </script>
