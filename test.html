<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Luna — équipe (TEST)</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#B83B1B">
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; height: 100dvh; }
    .test-banner { flex: 0 0 auto; padding: 6px 12px; background: #B83B1B; color: #fff; font-size: 13px; text-align: center; }
    #luna { flex: 1 1 auto; min-height: 0; width: 100%; }
    .barre { flex: 0 0 auto; display: flex; justify-content: flex-end; padding: 8px 12px; border-bottom: 1px solid #e3e8ee; }
    .barre button { min-height: 48px; padding: 0 20px; border: 0; border-radius: 24px; background: #1B6FB8; color: #fff; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; }
    .barre button:active { background: #155a96; }
  </style>
</head>
<body>
  <div class="test-banner">VERSION TEST — conversation gardée + bouton Nouvelle conversation</div>
  <!-- La conversation reste sur l'appareil (même après un rechargement) jusqu'à ce que
       l'employé·e choisisse d'en commencer une nouvelle. -->
  <div class="barre"><button type="button" id="nouvelle">+ Nouvelle conversation</button></div>
  <div id="luna"></div>

  <script type="text/javascript">
    document.getElementById('nouvelle').addEventListener('click', function () {
      if (!confirm('Commencer une nouvelle conversation ? La conversation actuelle sera effacée de l\'écran.')) return;
      try {
        // Le widget garde sa session sous des clés « voiceflow… » : on les retire puis on recharge.
        Object.keys(localStorage).forEach(function (k) {
          if (k.toLowerCase().indexOf('voiceflow') === 0) localStorage.removeItem(k);
        });
      } catch (e) {}
      location.reload();
    });
  </script>

  <!-- Micro en français : le widget démarre la reconnaissance vocale du navigateur sans langue,
       donc le téléphone utiliserait sa propre langue. On fixe fr-CA avant le chargement du widget. -->
  <script type="text/javascript">
    (function () {
      var Native = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Native) return;
      function FrenchRecognition() { var r = new Native(); r.lang = 'fr-CA'; return r; }
      FrenchRecognition.prototype = Native.prototype;
      window.SpeechRecognition = FrenchRecognition;
      window.webkitSpeechRecognition = FrenchRecognition;
    })();
  </script>

  <!-- Chargé une seule fois. Version PUBLIÉE de Voiceflow, affichée plein écran. -->
  <script type="text/javascript">
    (function (d, t) {
      var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
      v.onload = function () {
        window.voiceflow.chat.load({
          verify: { projectID: '6aa45f238108f292ae45db64' },
          url: 'https://general-runtime.voiceflow.com',
          voice: { url: 'https://runtime-api.voiceflow.com' },
          render: { mode: 'embedded', target: d.getElementById('luna') },
          assistant: { persistence: 'localStorage' },
          autostart: true
        });
      };
      v.src = 'https://cdn.voiceflow.com/widget-next/bundle.mjs';
      v.type = 'text/javascript';
      s.parentNode.insertBefore(v, s);
    })(document, 'script');
  </script>
</body>
</html>
